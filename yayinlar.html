<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yayınlar | Çapa Gastroenterohepatoloji</title>
<meta name="description" content="İstanbul Tıp Fakültesi Gastroenterohepatoloji Bilim Dalı öğretim üyeleri ve yan dal asistanlarının PubMed'de dizinlenen yayınları, dergi etki faktörüne göre sıralı.">
<link rel="canonical" href="https://besimagargun.com/capagastro/yayinlar.html">
<meta property="og:title" content="Yayınlar | Çapa Gastroenterohepatoloji">
<meta property="og:description" content="Bilim dalının PubMed'de dizinlenen yayınları, dergi etki faktörüne göre sıralı.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://besimagargun.com/capagastro/yayinlar.html">
<meta property="og:image" content="https://besimagargun.com/capagastro/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0F5F66">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='18' fill='%230F5F66'/%3E%3Cpath d='M12 24c0-6 4-9 8-9s8 3 8 9-4 5-8 5-8 1-8-5z' fill='none' stroke='%23F7F5EF' stroke-width='2.2' stroke-linejoin='round'/%3E%3Ccircle cx='20' cy='21' r='2.2' fill='%23F7F5EF'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script>
(function () {
  var d = document.documentElement, q = null, s = null, l;
  try { q = new URLSearchParams(location.search).get("lang"); } catch (e) {}
  try { s = localStorage.getItem("lang"); var t = localStorage.getItem("theme"); if (t) d.dataset.theme = t; } catch (e) {}
  if (q === "en" || q === "tr") { l = q; try { localStorage.setItem("lang", q); } catch (e) {} }
  else if (s === "en" || s === "tr") l = s;
  else l = (navigator.language || "tr").toLowerCase().indexOf("tr") === 0 ? "tr" : "en";
  window.__lang = l;
})();
</script>
<style>
:root{--paper:#F7F5EF;--paper-2:#EEEAE0;--ink:#1B2A2F;--ink-2:#4A5A5F;--teal:#0F5F66;--teal-2:#0B4A50;--teal-soft:#D7E7E6;--claret:#8B1E2D;--line:#CFC9BA;--font-display:"Fraunces",Georgia,serif;--font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
:root:not([data-theme="light"]){@media (prefers-color-scheme:dark){--paper:#141B1E;--paper-2:#1C2528;--ink:#EDE9DF;--ink-2:#B4B9B6;--teal:#5FB3B6;--teal-2:#7FC6C8;--teal-soft:#1F3437;--claret:#D66A77;--line:#33403F}}
:root[data-theme="dark"]{--paper:#141B1E;--paper-2:#1C2528;--ink:#EDE9DF;--ink-2:#B4B9B6;--teal:#5FB3B6;--teal-2:#7FC6C8;--teal-soft:#1F3437;--claret:#D66A77;--line:#33403F}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55}
a{color:var(--teal);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--claret);outline-offset:3px}
h1{font-family:var(--font-display);font-weight:500;line-height:1.1;margin:0 0 .4em;letter-spacing:-.01em;font-size:clamp(2rem,4.5vw,3.2rem)}
.wrap{width:min(1100px,92vw);margin:0 auto}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:.6rem;padding:.7rem 0}
.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none;color:var(--ink);font-family:var(--font-display);font-size:1.1rem;font-weight:600;line-height:1.2;margin-right:auto}
.brand svg{width:32px;height:32px;flex-shrink:0;color:var(--teal)}
.brand small{display:block;font-family:var(--font-body);font-weight:400;font-size:.72rem;color:var(--ink-2)}
.btn{display:inline-block;border:1px solid var(--teal);color:var(--teal);background:transparent;border-radius:999px;padding:.4rem .95rem;font:500 .9rem var(--font-body);cursor:pointer;text-decoration:none;line-height:1.4}
.btn:hover{background:var(--teal);color:var(--paper)}
.btn.icon{padding:.35rem .6rem;min-width:2.3rem;text-align:center}
@media (max-width:560px){.brand small{display:none}.bar .home{display:none}}
.intro{padding:3rem 0 2rem;border-bottom:1px solid var(--line)}
.intro p{color:var(--ink-2);max-width:70ch;margin:0 0 .6em}
.stats{display:flex;gap:2.2rem;flex-wrap:wrap;margin-top:1.4rem}
.stats b{display:block;font-family:var(--font-display);font-size:1.9rem;font-weight:500;color:var(--teal);line-height:1.1}
.stats span{font-size:.88rem;color:var(--ink-2)}
.controls{position:sticky;top:62px;z-index:10;background:var(--paper-2);border-bottom:1px solid var(--line);padding:.8rem 0}
.controls .wrap{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
input,select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:.45rem .7rem;max-width:100%}
input[type=search]{flex:1;min-width:200px}
.count{color:var(--ink-2);font-size:.9rem;margin-left:auto}
.clear{background:none;border:0;color:var(--teal);font:inherit;font-size:.9rem;cursor:pointer;text-decoration:underline;padding:0}
.list{list-style:none;padding:0;margin:0 0 2rem}
.list li{display:grid;grid-template-columns:5rem 1fr;gap:1rem;padding:1rem 0;border-bottom:1px solid var(--line)}
.rank{font-family:var(--font-display);font-size:1.15rem;color:var(--claret);line-height:1.3}
.rank small{display:block;font-family:var(--font-body);font-size:.72rem;color:var(--ink-2)}
.t{font-weight:600}
.t a{color:var(--ink);text-decoration:none}
.t a:hover{color:var(--teal);text-decoration:underline}
.m{color:var(--ink-2);font-size:.9rem;margin-top:.15rem}
.m i{color:var(--claret)}
.tags{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.4rem}
.tags span{font-size:.74rem;background:var(--teal-soft);color:var(--teal-2);padding:.1rem .5rem;border-radius:4px}
.tags .typ{background:transparent;border:1px solid var(--line);color:var(--ink-2)}
.list li.empty{display:block;padding:2rem 0;color:var(--ink-2);border:0}
.note{font-size:.85rem;color:var(--ink-2);border-left:3px solid var(--line);padding:.5rem .9rem;margin:1.5rem 0 3rem;max-width:80ch}
@media (max-width:640px){.list li{grid-template-columns:1fr;gap:.2rem}.rank{display:flex;gap:.5rem;align-items:baseline}.controls{position:static}.count{margin-left:0;width:100%}}
footer{padding:2rem 0;color:var(--ink-2);font-size:.85rem;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="brand" href="index.html">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 24c0-6 4-9 8-9s8 3 8 9-4 5-8 5-8 1-8-5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="20" cy="21" r="2.2" fill="currentColor"/></svg>
      <span>Çapa Gastroenterohepatoloji<small data-i="sub">İstanbul Tıp Fakültesi, İstanbul Üniversitesi</small></span>
    </a>
    <a class="btn home" href="index.html#yayinlar" data-i="home">Ana sayfa</a>
    <button class="btn icon" id="theme" type="button">☾</button>
    <button class="btn" id="lang" type="button">EN</button>
  </div>
</header>
<main>
  <div class="intro"><div class="wrap">
    <h1 data-i="h1">Yayınlar</h1>
    <p data-i="intro"></p>
    <div class="stats" id="stats"></div>
  </div></div>
  <div class="controls"><div class="wrap">
    <input type="search" id="q" autocomplete="off">
    <select id="who"></select>
    <select id="typ"></select>
    <select id="sort"></select>
    <button class="clear" id="clear" type="button" hidden></button>
    <span class="count" id="count" aria-live="polite"></span>
  </div></div>
  <div class="wrap">
    <ol class="list" id="list"></ol>
    <div class="note" data-i="note"></div>
  </div>
</main>
<footer><div class="wrap">© <span id="year"></span> <span data-i="foot"></span></div></footer>
<script src="pubs.js"></script>
<script>
const T = {
  tr: {
    title: "Yayınlar | Çapa Gastroenterohepatoloji", sub: "İstanbul Tıp Fakültesi, İstanbul Üniversitesi", home: "Ana sayfa", h1: "Yayınlar",
    intro: "Bilim dalı öğretim üyeleri ve yan dal asistanlarının PubMed'de dizinlenen yayınları. Liste dergi etki faktörüne, eşitlikte yıla göre sıralanır; kişiye, türe veya metne göre filtreleyebilirsiniz.",
    pubs: "yayın", span: "yıl aralığı", hi: "etki faktörü 10 ve üzeri dergide", members: "ekip üyesi",
    q: "Başlık, dergi veya yazar ara", all: "Tüm ekip", types: "Tüm türler",
    type: { Article: "Araştırma makalesi", Review: "Derleme", Letter: "Editöre mektup", Case: "Olgu sunumu" },
    chip: { Article: "Makale", Review: "Derleme", Letter: "Mektup", Case: "Olgu" },
    sort: { jif: "Etki faktörüne göre", year: "Yıla göre (yeni)", journal: "Dergiye göre" },
    count: n => `${n} yayın`, IF: "EF", clear: "Filtreleri temizle",
    none: "Bu filtrelerle eşleşen yayın yok. Aramayı kısaltın veya filtreleri temizleyin.",
    note: "Kaynak: PubMed (NCBI). Etki faktörleri Journal Citation Reports'a dayalı yaklaşık değerlerdir ve yalnızca sıralama için kullanılır; resmi değerler için Clarivate JCR'ye bakın. Yazar adları PubMed'deki biçimiyle verilmiştir. Eksik ya da hatalı bir kayıt görürseniz <a href=\"mailto:bfagargun@istanbul.edu.tr\">bize yazın</a>.",
    foot: "İstanbul Üniversitesi İstanbul Tıp Fakültesi Gastroenterohepatoloji Bilim Dalı",
    langBtn: "EN", langAria: "Switch to English", theme: "Açık veya koyu tema",
    aria: { q: "Yayınlarda ara", who: "Kişi", typ: "Yayın türü", sort: "Sıralama" }
  },
  en: {
    title: "Publications | Çapa Gastroenterohepatology", sub: "Istanbul Faculty of Medicine, Istanbul University", home: "Home", h1: "Publications",
    intro: "PubMed-indexed publications by the division's faculty and fellows. The list is ranked by journal impact factor, then by year; filter by person, type or text.",
    pubs: "publications", span: "years covered", hi: "in journals with an impact factor of 10 or more", members: "team members",
    q: "Search title, journal or author", all: "All members", types: "All types",
    type: { Article: "Research article", Review: "Review", Letter: "Letter", Case: "Case report" },
    chip: { Article: "Article", Review: "Review", Letter: "Letter", Case: "Case" },
    sort: { jif: "By impact factor", year: "By year (newest)", journal: "By journal" },
    count: n => `${n} publications`, IF: "IF", clear: "Clear filters",
    none: "No publications match these filters. Try a shorter search or clear the filters.",
    note: "Source: PubMed (NCBI). Impact factors are approximate values based on Journal Citation Reports and are used only for ranking; see Clarivate JCR for official figures. Author names appear as listed in PubMed. If you spot a missing or incorrect record, <a href=\"mailto:bfagargun@istanbul.edu.tr\">write to us</a>.",
    foot: "Division of Gastroenterohepatology, Istanbul Faculty of Medicine, Istanbul University",
    langBtn: "TR", langAria: "Türkçeye geç", theme: "Light or dark theme",
    aria: { q: "Search publications", who: "Person", typ: "Publication type", sort: "Sort order" }
  }
};
const $ = id => document.getElementById(id);
const q = $("q"), who = $("who"), typ = $("typ"), sort = $("sort"), list = $("list"), count = $("count"), clearBtn = $("clear");
const byMember = m => PUBS_ALL.filter(p => p.members.includes(m)).length;
const members = [...new Set(PUBS_ALL.flatMap(p => p.members))].sort((a, b) => byMember(b) - byMember(a));
const fold = s => s.toLocaleLowerCase("tr").replace(/ı/g, "i").replace(/ş/g, "s").replace(/ç/g, "c").replace(/ğ/g, "g").replace(/ü/g, "u").replace(/ö/g, "o").replace(/<\/?i>/g, "");
let lang = window.__lang || "tr";

function fillSelects() {
  const t = T[lang], w = who.value, ty = typ.value, so = sort.value || "jif";
  who.innerHTML = `<option value="">${t.all}</option>` + members.map(m => `<option value="${m}">${m} (${byMember(m)})</option>`).join("");
  typ.innerHTML = `<option value="">${t.types}</option>` + Object.keys(t.type).map(k => `<option value="${k}">${t.type[k]}</option>`).join("");
  sort.innerHTML = Object.keys(t.sort).map(k => `<option value="${k}">${t.sort[k]}</option>`).join("");
  who.value = w; typ.value = ty; sort.value = so;
}
function stats() {
  const t = T[lang], years = PUBS_ALL.map(p => p.year);
  $("stats").innerHTML = `<div><b>${PUBS_ALL.length}</b><span>${t.pubs}</span></div><div><b>${Math.min(...years)}-${Math.max(...years)}</b><span>${t.span}</span></div><div><b>${PUBS_ALL.filter(p => (p.jif || 0) >= 10).length}</b><span>${t.hi}</span></div><div><b>${members.length}</b><span>${t.members}</span></div>`;
}
function render() {
  const t = T[lang], s = fold(q.value.trim());
  let rows = PUBS_ALL.filter(p => (!who.value || p.members.includes(who.value)) && (!typ.value || p.type === typ.value) && (!s || fold(p.title + " " + p.journal + " " + p.authors).includes(s)));
  if (sort.value === "year") rows.sort((a, b) => b.year - a.year || (b.jif || 0) - (a.jif || 0));
  else if (sort.value === "journal") rows.sort((a, b) => a.journal.localeCompare(b.journal) || b.year - a.year);
  else rows.sort((a, b) => (b.jif || 0) - (a.jif || 0) || b.year - a.year);
  count.textContent = t.count(rows.length);
  clearBtn.hidden = !(q.value || who.value || typ.value);
  list.innerHTML = rows.length ? rows.map((p, i) => `<li>
    <div class="rank">${i + 1}<small>${p.jif != null ? t.IF + " " + p.jif.toFixed(1) : ""}</small></div>
    <div>
      <div class="t"><a href="${p.doi ? "https://doi.org/" + p.doi : "https://pubmed.ncbi.nlm.nih.gov/" + p.pmid + "/"}" target="_blank" rel="noopener">${p.title}</a></div>
      <div class="m">${p.authors} <i>${p.journal}</i> ${p.year}. <a href="https://pubmed.ncbi.nlm.nih.gov/${p.pmid}/" target="_blank" rel="noopener">PubMed</a></div>
      <div class="tags">${p.members.map(m => `<span>${m}</span>`).join("")}<span class="typ">${t.chip[p.type] || p.type}</span></div>
    </div></li>`).join("") : `<li class="empty">${t.none}</li>`;
}
function applyLang(l, persist) {
  lang = l;
  const t = T[l];
  document.documentElement.lang = l;
  document.title = t.title;
  document.querySelectorAll("[data-i]").forEach(el => { el.innerHTML = t[el.dataset.i]; });
  q.placeholder = t.q;
  for (const k in t.aria) $(k).setAttribute("aria-label", t.aria[k]);
  $("lang").textContent = t.langBtn;
  $("lang").setAttribute("aria-label", t.langAria);
  $("theme").setAttribute("aria-label", t.theme);
  clearBtn.textContent = t.clear;
  fillSelects(); stats(); render();
  if (persist) {
    try { localStorage.setItem("lang", l); } catch (e) {}
    try { const u = new URL(location.href); if (u.searchParams.has("lang")) { u.searchParams.set("lang", l); history.replaceState(null, "", u); } } catch (e) {}
  }
}
[q, who, typ, sort].forEach(el => el.addEventListener("input", render));
clearBtn.addEventListener("click", () => { q.value = ""; who.value = ""; typ.value = ""; render(); q.focus(); });
$("lang").addEventListener("click", () => applyLang(lang === "tr" ? "en" : "tr", true));

/* tema */
const themeBtn = $("theme");
const isDark = () => document.documentElement.dataset.theme === "dark" || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
themeBtn.addEventListener("click", () => {
  const t = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("theme", t); } catch (e) {}
  themeBtn.textContent = isDark() ? "☀" : "☾";
});
themeBtn.textContent = isDark() ? "☀" : "☾";

fillSelects();
const u = new URLSearchParams(location.search);
if (u.get("kisi") && members.includes(u.get("kisi"))) who.value = u.get("kisi");
if (u.get("q")) q.value = u.get("q");
applyLang(lang, false);
$("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
