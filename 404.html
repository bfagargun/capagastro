<style>
:root{--paper:#F7F5EF;--ink:#1B2A2F;--ink-2:#4A5A5F;--teal:#0F5F66;--line:#CFC9BA}
@media (prefers-color-scheme:dark){:root{--paper:#141B1E;--ink:#EDE9DF;--ink-2:#B4B9B6;--teal:#5FB3B6;--line:#33403F}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:"Public Sans",system-ui,sans-serif;line-height:1.6;padding:2rem 1rem}
main{max-width:34rem}
svg{width:44px;height:44px;color:var(--teal)}
h1{font-family:"Fraunces",Georgia,serif;font-weight:300;font-size:clamp(2rem,6vw,3rem);line-height:1.1;margin:1rem 0 .6rem}
p{color:var(--ink-2);margin:0 0 .4rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.6rem}
a{display:inline-block;border:1px solid var(--teal);color:var(--teal);border-radius:999px;padding:.4rem 1rem;text-decoration:none;font-weight:500}
a:hover{background:var(--teal);color:var(--paper)}
</style>
</head>
